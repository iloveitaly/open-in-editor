[package]
name = "open-in-editor"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Deterministic terminal file reference parser and vector-safe editor dispatcher"
license = "MIT"
repository = "https://github.com/iloveitaly/open-in-editor"
homepage = "https://github.com/iloveitaly/open-in-editor"
keywords = ["cli", "editor", "terminal", "parser", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
