[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }
"github:casey/just" = "latest"
jq = "latest"

[bootstrap.packages]
"apt:zsh" = { os = "linux" }

[tasks.build]
description = "Build the binary"
run = "cargo build"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.lint]
description = "Run clippy linter"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.fmt]
description = "Check formatting"
run = "cargo fmt --check"
